services:
  elasticsearch:
    image: elasticsearch:9.5.1
    container_name: es-local
    environment:
      - discovery.type=single-node # single node only
      - xpack.security.enabled=false # disable all the security realted things
      - xpack.security.http.ssl.enabled=false # tunr off ssl
      - ES_JAVA_OPTS=-Xms1g -Xmx1g # allocated memeory to JVM 1GB
    ports:
      - "9200:9200"
